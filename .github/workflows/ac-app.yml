name: Build Race Kiosk AC App

on:
  push:
    branches:
      - main
    # Path filters are ignored for tag pushes, so every v* tag builds and releases
    tags:
      - 'v*'
    paths:
      - 'ac-app/**'
  pull_request:
    paths:
      - 'ac-app/**'

jobs:
    build:
        runs-on: windows-latest

        permissions:
          contents: write

        steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        # AC embeds Python 3.3, which isn't available here; the code sticks to 3.3 syntax and the
        # tests also pass on 3.3.5 locally (see ac-app/README.md)
        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: '3.11'

        - name: Run tests
          run: python -m unittest discover -s ac-app/tests -v

        - name: Package app folder
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force dist | Out-Null
            Copy-Item -Recurse ac-app/racekiosk dist/racekiosk
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist/racekiosk/settings.ini, dist/racekiosk/outbox.json
            Get-ChildItem dist -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force

        - name: Stamp app version
          shell: pwsh
          run: |
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $version = $env:GITHUB_REF_NAME -replace '^v', ''
            } else {
              $version = "0.0.0-dev+$($env:GITHUB_SHA.Substring(0, 7))"
            }
            $file = 'dist/racekiosk/racekiosk_lib/__init__.py'
            $content = Get-Content -Raw $file
            $pattern = '(?m)^APP_VERSION = "[^"]*"'
            if ($content -notmatch $pattern) { throw "APP_VERSION line not found in $file" }
            # UTF-8 without BOM, which Python 3.3 reads fine
            [IO.File]::WriteAllText($file, ($content -replace $pattern, "APP_VERSION = `"$version`""))
            Write-Host "APP_VERSION = $version"

        # Extract the downloaded zip into <AC>/apps/python/ (it contains the racekiosk folder)
        - name: Upload artifact
          if: ${{ !startsWith(github.ref, 'refs/tags/') }}
          uses: actions/upload-artifact@v4
          with:
            name: racekiosk
            path: dist/

        - name: Zip app for release
          if: startsWith(github.ref, 'refs/tags/')
          shell: pwsh
          run: Compress-Archive -Path dist/racekiosk -DestinationPath "racekiosk-${{ github.ref_name }}.zip"

        - name: Create release
          if: startsWith(github.ref, 'refs/tags/')
          uses: softprops/action-gh-release@v3
          with:
            files: racekiosk-${{ github.ref_name }}.zip
            generate_release_notes: true
            prerelease: ${{ contains(github.ref_name, '-') }}
