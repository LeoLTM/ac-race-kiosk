name: Race Kiosk Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  # release.yml runs this for v* tags and attaches the executables to the release
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Uses the version from "packageManager" in server/package.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # One executable per OS (Node, backend, frontend and migrations inside). Each OS builds its own, since only the
  # host's libsql native addon gets installed.
  package:
    needs: check

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/package.json

      # pkg runs on Node
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        run: bun run package

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: racekiosk-server-${{ runner.os }}
          path: server/backend/release/
