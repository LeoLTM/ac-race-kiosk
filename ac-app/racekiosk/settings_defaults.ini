; Race Kiosk app defaults. On first start this file is copied to settings.ini - edit that copy per rig.

[kiosk]
; URL of the kiosk backend (the same server the web kiosk talks to)
backend_url = http://192.168.1.100:8080
; This rig's number (1..NUMBER_OF_RIGS on the server)
rig_id = 1
; Must match KIOSK_KEY in the server's .env (leave empty if the server has none)
kiosk_key =
; Seconds between status polls
poll_interval = 1.0
; Seconds before a request to the server is given up
request_timeout = 2.0

[laps]
; Laps faster than this (ms) are reported as invalid (e.g. teleport glitches)
min_lap_ms = 20000

[ui]
; Size of the in-game window, 1.0 = 100%
scale = 1.0
; Window background opacity (0..1)
opacity = 0.85
